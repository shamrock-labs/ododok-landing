<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Ododok｜ページを準備しています</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      align-items: center;
      background: #fff7eb;
      color: #2a211b;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      justify-content: center;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    main { max-width: 320px; }
    .mark { font-size: 40px; line-height: 1; }
    p { font-size: 15px; line-height: 1.7; margin: 16px 0 0; }
    noscript a { color: #7d512d; }
  </style>
  <script>
    (() => {
      const EXPERIMENT_ID = "jp_concept_v1";
      const STORAGE_KEY = "ododok:jp-concept:v1";
      const VARIANTS = ["health", "point"];
      const params = new URLSearchParams(location.search);
      const forcedVariant = params.get("variant");
      let variant;
      let assignmentSource;

      if (VARIANTS.includes(forcedVariant)) {
        variant = forcedVariant;
        assignmentSource = "forced";
      } else {
        try {
          const storedVariant = localStorage.getItem(STORAGE_KEY);
          if (VARIANTS.includes(storedVariant)) {
            variant = storedVariant;
            assignmentSource = "stored";
          }
        } catch (_) {
          // Private browsing or browser policy can make storage unavailable.
        }

        if (!variant) {
          const randomValue = new Uint32Array(1);
          if (globalThis.crypto?.getRandomValues) {
            globalThis.crypto.getRandomValues(randomValue);
            variant = VARIANTS[randomValue[0] % VARIANTS.length];
          } else {
            variant = VARIANTS[Math.floor(Math.random() * VARIANTS.length)];
          }
          assignmentSource = "random";

          try {
            localStorage.setItem(STORAGE_KEY, variant);
          } catch (_) {
            // Continue with the in-memory assignment when storage is unavailable.
          }
        }
      }

      params.delete("variant");
      params.set("experiment_id", EXPERIMENT_ID);
      params.set("experiment_variant", variant);
      params.set("assignment_source", assignmentSource);

      const basePath = location.pathname.endsWith("/")
        ? location.pathname
        : `${location.pathname}/`;
      const destination = new URL(`${basePath}${variant}/`, location.origin);
      destination.search = params.toString();
      destination.hash = location.hash;
      location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🐿️</div>
    <p>あなたに合うOdodokのページを準備しています。</p>
    <noscript>
      <p>JavaScriptを有効にするか、<a href="./health/">健康記録版</a>または<a href="./point/">ポイント版</a>を選んでください。</p>
    </noscript>
  </main>
</body>
</html>
